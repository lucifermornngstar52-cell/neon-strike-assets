<!DOCTYPE html><html><head><meta charset="utf-8"><title>Weapons</title>
<style>body{margin:0;background:#111;color:#ccc;font-family:monospace;overflow:hidden}h3{position:fixed;top:6px;left:10px;color:#0ff;z-index:9;text-shadow:0 0 4px #000}</style></head>
<body><h3 id="st">LOADING...</h3>
<h3 id="dbg" style="color:#fa5">DEBUG WAIT</h3>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
var BASE='https://lucifermornngstar52-cell.github.io/neon-strike-assets/';
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(1);
renderer.setClearColor(0x14141f);
document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x555566,1.2));
var d=new THREE.DirectionalLight(0xffffff,0.8);d.position.set(5,10,6);scene.add(d);
var grid=new THREE.GridHelper(60,60,0x334455,0x222233);scene.add(grid);
var loader=new THREE.GLTFLoader();
var names=[];
for(var i=0;i<18;i++)names.push('blaster-'+String.fromCharCode(97+i)+'.glb');
var total=names.length,okN=0,errN=0,errList='';
var st=document.getElementById('st');
var dbg=document.getElementById('dbg');
fetch(BASE+names[0]).then(function(r){dbg.textContent='FETCH1 status='+r.status;return r.arrayBuffer();}).then(function(b){dbg.textContent+=' bytes='+b.byteLength+' magic='+String.fromCharCode(b[0],b[1],b[2],b[3]);
  try{loader.parse(b,BASE,function(g){dbg.textContent+=' PARSE_OK meshes=';var c2=0;g.scene.traverse(function(o){if(o.isMesh)c2++;});dbg.textContent+=c2;},function(e){dbg.textContent+=' PARSE_ERR '+(e&&e.message||e);});}catch(e){dbg.textContent+=' PARSE_THROW '+e.message;}
}).catch(function(e){dbg.textContent='FETCH1 ERR '+e.message;});
fetch(BASE+'robot.glb').then(function(r){dbg.textContent+=' | ROBOT status='+r.status;return r.arrayBuffer();}).then(function(b){dbg.textContent+=' bytes='+b.byteLength;}).catch(function(e){dbg.textContent+=' | ROBOT ERR '+e.message;});
function upd(){st.textContent='loading OK='+okN+' ERR='+errN+(errN?' ['+errList+']':'');}
function finish(){
  if(okN+errN<total)return;
  st.textContent='DONE OK='+okN+' ERR='+errN+(errN?' ['+errList+']':'')+' THREE rev '+THREE.REVISION+' GLTFLoader='+(typeof THREE.GLTFLoader);
}
camera.position.set(0,9,21);camera.lookAt(0,1,6);
function place(gltf,idx){
  var m=gltf.scene;
  var box=new THREE.Box3().setFromObject(m);
  var size=box.getSize(new THREE.Vector3());
  var md=Math.max(size.x,size.y,size.z)||1;
  var s=2.4/md;m.scale.set(s,s,s);
  box=new THREE.Box3().setFromObject(m);
  var min=box.getMin(new THREE.Vector3());
  m.position.x-=min.x;m.position.y-=min.y;m.position.z-=min.z;
  var col=idx%6,row=Math.floor(idx/6);
  m.position.x+=(col-2.5)*5-1.2;
  m.position.z+=row*5;
  scene.add(m);
  var mk=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.4,0.4),new THREE.MeshBasicMaterial({color:0xffcc00}));
  mk.position.set(m.position.x+1.2,0.25,m.position.z+1.2);
  scene.add(mk);
  okN++;upd();finish();
}
function fail(idx){
  errN++;errList+=names[idx]+' ';
  upd();finish();
}
for(var j=0;j<names.length;j++){
  (function(idx){
    loader.load(BASE+names[idx],
      function(g){place(g,idx);},
      undefined,
      function(){fail(idx);});
  })(j);
}
(function anim(){requestAnimationFrame(anim);renderer.render(scene,camera);})();
})();
</script></body></html>
