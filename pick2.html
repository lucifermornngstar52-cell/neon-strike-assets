<!DOCTYPE html><html><head><meta charset="utf-8"><title>Pick2</title>
<style>body{background:#111;color:#fff;font-family:monospace;margin:8px}
.grid{display:flex;flex-wrap:wrap;align-items:flex-end}
.cell{width:300px;margin:3px;background:#1a1a28;padding:4px;text-align:center}
.cell img{width:290px;height:200px;object-fit:contain;background:#000}
.cell div{font-size:18px;color:#0ff;padding:4px}</style></head><body>
<div class="grid" id="g"></div>
<script>
function getQ(){var q=location.search.match(/set=(\d+)/);return q?parseInt(q[1]):0;}
var sets=[['a','b','c','d','e','f','g','h','i'],['j','k','l','m','n','o','p','q','r']];
var g=document.getElementById('g');
sets[getQ()].forEach(function(l){
  var c=document.createElement('div');c.className='cell';
  var im=document.createElement('img');im.src='previews/w-blaster-'+l+'.png';c.appendChild(im);
  var d=document.createElement('div');d.textContent='BLASTER-'+l.toUpperCase();c.appendChild(d);
  g.appendChild(c);
});
</script></body></html>
